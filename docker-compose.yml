version: '3.8'

services:
  aether-messenger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aether-messenger
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=https://Aether.xperiserv.in
    volumes:
      - aether_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/branding"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  aether_data:
